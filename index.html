<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>كتابي التفاعلي | تكنولوجيا المعلومات</title>
<style>
:root{--ink:#183047;--blue:#176b87;--pale:#eef7fa;--gold:#f2b84b;--green:#237a57}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:var(--ink);line-height:1.8}.hero{background:linear-gradient(135deg,#12445d,#2186a0);color:white;padding:30px 18px;text-align:center}.hero h1{margin:0 0 8px;font-size:27px}.wrap{max-width:950px;margin:20px auto;padding:0 14px}.layout{display:grid;grid-template-columns:250px 1fr;gap:16px}.panel,.lesson{background:white;border-radius:16px;padding:18px;box-shadow:0 5px 18px #18304712}.panel h3{margin-top:0}.nav button,.action{display:block;width:100%;border:0;border-radius:10px;padding:11px;margin:7px 0;text-align:right;background:var(--pale);color:var(--ink);font:inherit;cursor:pointer}.nav button.active,.action{background:var(--blue);color:white}.lesson h2{margin-top:0;color:var(--blue)}.tag{display:inline-block;background:#fff2d7;color:#76500b;border-radius:30px;padding:2px 12px;font-size:13px}.callout{background:#f0f8f4;border-right:4px solid var(--green);padding:12px;border-radius:8px;margin:14px 0}.quiz{border-top:1px solid #e5edf2;margin-top:22px;padding-top:14px}.q{padding:12px;background:#f7f9fc;border-radius:10px;margin:12px 0}.q label{display:block;cursor:pointer}.feedback{font-weight:bold;margin-top:8px}.actions{display:flex;gap:8px;margin-top:18px}.actions button{width:auto;text-align:center;flex:1}.progress{height:9px;background:#e7edf2;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:#35a477;transition:width .2s}.small{font-size:13px;color:#607486}footer{text-align:center;padding:24px;color:#667}
@media(max-width:700px){.layout{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:1fr 1fr;gap:4px}.nav button{font-size:13px}.hero h1{font-size:22px}}
</style></head>
<body>
<header class="hero"><span class="tag">كتاب إلكتروني تفاعلي</span><h1>رحلتي مع تكنولوجيا المعلومات</h1><div>الصف السادس الابتدائي • نموذج تعليمي من وحدتين</div><p>اقرأ الدروس، جرّب الأنشطة، ثم اختبر فهمك.</p></header>
<main class="wrap"><div class="layout"><aside class="panel"><h3>فهرس الكتاب</h3><div class="progress"><div class="bar" id="bar"></div></div><p class="small" id="progressText">الدرس 1 من 6</p><div class="nav" id="nav"></div><button class="action" onclick="showOverview()">العودة إلى مقدمة الكتاب</button></aside><article class="lesson" id="content" aria-live="polite"></article></div></main>
<footer>إعداد تعليمي تجريبي — يمكن تعديل المحتوى ليتوافق مع منهج المدرسة.</footer>
<script>
const lessons=[
{unit:'الوحدة الأولى: أساسيات العالم الرقمي',title:'الدرس الأول: ما تكنولوجيا المعلومات؟',goals:'أن يعرّف المتعلم تكنولوجيا المعلومات، ويذكر أمثلة لاستخدامها في الحياة اليومية.',body:`<h3>ما المقصود بتكنولوجيا المعلومات؟</h3><p>هي استخدام الأجهزة والبرامج ووسائل الاتصال لجمع المعلومات ومعالجتها وتخزينها وتبادلها. نستخدمها في التعلم والتواصل وتنظيم الأعمال.</p><h3>أمثلة من حياتنا</h3><ul><li>استخدام الحاسوب في كتابة الأبحاث.</li><li>التعلم من خلال المنصات التعليمية.</li><li>إرسال رسالة إلكترونية أو إجراء مكالمة مرئية.</li></ul><div class="callout"><b>تذكّر:</b> التكنولوجيا وسيلة تساعد الإنسان، ويجب استخدامها بطريقة آمنة ومسؤولة.</div>`,activity:'اذكر مثالين لاستخدام تكنولوجيا المعلومات في مدرستك أو منزلك.' ,q:'أي مما يلي يُعد استخدامًا لتكنولوجيا المعلومات؟',opts:['كتابة بحث باستخدام الحاسوب','إغلاق الكتاب دون قراءته','ترك الجهاز يعمل دون استخدام'],ans:0,why:'كتابة البحث بالحاسوب مثال على استخدام التقنية لمعالجة المعلومات.'},
{unit:'الوحدة الأولى: أساسيات العالم الرقمي',title:'الدرس الثاني: مكونات الحاسوب',goals:'أن يميّز المتعلم بين وحدات الإدخال والإخراج والمعالجة والتخزين.',body:`<h3>مكونات الحاسوب</h3><p>يتكون نظام الحاسوب من أجزاء تعمل معًا لاستقبال البيانات ومعالجتها ثم إخراج النتائج.</p><ul><li><b>وحدات الإدخال:</b> مثل لوحة المفاتيح والفأرة، وتستخدم لإدخال البيانات.</li><li><b>وحدة المعالجة:</b> تنفذ التعليمات وتعالج البيانات.</li><li><b>وحدات الإخراج:</b> مثل الشاشة والطابعة، وتعرض النتائج.</li><li><b>وحدات التخزين:</b> مثل القرص وذاكرة USB، وتحفظ الملفات.</li></ul><div class="callout"><b>مثال:</b> نكتب الكلمات بلوحة المفاتيح (إدخال)، ثم تظهر على الشاشة (إخراج).</div>`,activity:'صنّف: الشاشة، الفأرة، لوحة المفاتيح، الطابعة. إلى إدخال أو إخراج.',q:'أي جهاز يُستخدم لإدخال النصوص؟',opts:['الشاشة','لوحة المفاتيح','السماعة'],ans:1,why:'لوحة المفاتيح من وحدات الإدخال.'},
{unit:'الوحدة الأولى: أساسيات العالم الرقمي',title:'الدرس الثالث: الملفات والمجلدات',goals:'أن يشرح المتعلم الفرق بين الملف والمجلد، وينظم ملفاته بطريقة واضحة.',body:`<h3>الملف والمجلد</h3><p>الملف هو عنصر يحتوي على بيانات، مثل صورة أو مستند أو عرض تقديمي. أما المجلد فيُستخدم لتجميع الملفات وتنظيمها.</p><h3>قواعد تنظيم الملفات</h3><ol><li>اختر اسمًا واضحًا للملف.</li><li>ضع الملفات المتشابهة في مجلد واحد.</li><li>احتفظ بنسخة احتياطية من الملفات المهمة.</li><li>تجنب حذف الملفات قبل التأكد من عدم الحاجة إليها.</li></ol>`,activity:'اقترح اسم مجلد تجمع بداخله واجبات مادة تكنولوجيا المعلومات.',q:'ما الوظيفة الأساسية للمجلد؟',opts:['تشغيل الحاسوب','تنظيم وتجميع الملفات','طباعة الأوراق'],ans:1,why:'المجلد يساعد على تنظيم الملفات وتجميعها.'},
{unit:'الوحدة الثانية: الإنترنت والأمان الرقمي',title:'الدرس الرابع: الإنترنت والبحث',goals:'أن يوضح المتعلم مفهوم الإنترنت، ويستخدم كلمات بحث مناسبة.',body:`<h3>ما الإنترنت؟</h3><p>الإنترنت شبكة عالمية تربط أجهزة كثيرة، وتتيح تبادل المعلومات والتواصل والوصول إلى مصادر التعلم.</p><h3>كيف نبحث بفاعلية؟</h3><ul><li>اكتب كلمات مفتاحية واضحة ومحددة.</li><li>اختر مصادر موثوقة مثل المواقع التعليمية الرسمية.</li><li>قارن المعلومات عند وجود أكثر من مصدر.</li><li>تحقق من تاريخ نشر المعلومة واسم الجهة الناشرة.</li></ul><div class="callout"><b>مثال:</b> بدلًا من كتابة «النبات»، اكتب «أجزاء النبات ووظيفة كل جزء للصف السادس».</div>`,activity:'اكتب عبارة بحث تساعدك في معرفة فوائد الماء للنبات.',q:'ما الأفضل عند البحث عن معلومة علمية؟',opts:['الاعتماد على أول نتيجة دائمًا','مقارنة مصادر موثوقة','نسخ أي معلومة دون مراجعة'],ans:1,why:'مقارنة المصادر والتحقق منها يساعدان على الوصول لمعلومة أدق.'},
{unit:'الوحدة الثانية: الإنترنت والأمان الرقمي',title:'الدرس الخامس: السلامة والأمان الرقمي',goals:'أن يحدد المتعلم سلوكيات آمنة عند استخدام الإنترنت.',body:`<h3>كيف أحمي نفسي على الإنترنت؟</h3><ul><li>لا تشارك كلمة المرور مع الآخرين.</li><li>استخدم كلمات مرور قوية ولا تعِد استخدامها في كل المواقع.</li><li>لا تفتح روابط أو مرفقات مجهولة.</li><li>لا تنشر بياناتك الشخصية أو صور الآخرين دون إذن.</li><li>أخبر ولي الأمر أو المعلم عند مواجهة محتوى مقلق أو رسالة مشبوهة.</li></ul><div class="callout"><b>قاعدة مهمة:</b> فكّر قبل أن تضغط أو تشارك.</div>`,activity:'اكتب تصرفًا آمنًا تقوم به إذا وصلتك رسالة من شخص لا تعرفه وبها رابط.',q:'ماذا تفعل عند وصول رابط من مصدر مجهول؟',opts:['أفتحه فورًا','أرسله لأصدقائي','لا أفتحه وأستشير شخصًا موثوقًا'],ans:2,why:'تجنب الروابط المجهولة واستشارة شخص موثوق سلوك آمن.'},
{unit:'الوحدة الثانية: الإنترنت والأمان الرقمي',title:'الدرس السادس: التواصل الرقمي المسؤول',goals:'أن يطبق المتعلم آداب التواصل الرقمي ويحترم الآخرين.',body:`<h3>التواصل الرقمي</h3><p>هو تبادل الرسائل والمعلومات باستخدام الوسائل الرقمية، مثل البريد الإلكتروني ومنصات التعلم.</p><h3>آداب التواصل</h3><ul><li>استخدم كلمات مهذبة وواضحة.</li><li>احترم آراء الآخرين ولا تسخر منهم.</li><li>تأكد من صحة المعلومة قبل إعادة نشرها.</li><li>لا تشارك محتوى خاصًا بشخص آخر دون موافقته.</li><li>اكتب عنوانًا مناسبًا للرسالة وراجعها قبل الإرسال.</li></ul>`,activity:'اكتب جملة مهذبة تطلب بها من معلمك توضيح واجب غير مفهوم.',q:'أي سلوك يعبر عن التواصل الرقمي المسؤول؟',opts:['السخرية من رأي الآخرين','نشر خبر دون التحقق منه','استخدام لغة محترمة والتحقق من المعلومات'],ans:2,why:'الاحترام والتحقق من المعلومات من أهم آداب التواصل الرقمي.'}
];
let current=0,visited=new Set();
const nav=document.getElementById('nav'),content=document.getElementById('content');
function buildNav(){nav.innerHTML='';let last='';lessons.forEach((l,i)=>{if(l.unit!==last){let h=document.createElement('div');h.style.cssText='grid-column:1/-1;font-weight:bold;margin-top:8px;color:#176b87';h.textContent=l.unit;nav.appendChild(h);last=l.unit}let b=document.createElement('button');b.textContent=l.title;b.onclick=()=>render(i);b.id='n'+i;nav.appendChild(b)})}
function update(){document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i===current));document.getElementById('bar').style.width=(visited.size/6*100)+'%';document.getElementById('progressText').textContent=`أنجزت ${visited.size} من 6 دروس`}
function render(i){current=i;visited.add(i);let l=lessons[i];content.innerHTML=`<span class="tag">${l.unit}</span><h2>${l.title}</h2><h3>أهداف الدرس</h3><p>${l.goals}</p>${l.body}<div class="callout"><b>نشاط تطبيقي:</b><p>${l.activity}</p></div><section class="quiz"><h3>اختبر فهمك</h3><p>${l.q}</p><div id="choices">${l.opts.map((o,j)=>`<label class="q"><input type="radio" name="answer" value="${j}"> ${o}</label>`).join('')}</div><button class="action" onclick="checkAnswer()">تحقق من الإجابة</button><div class="feedback" id="feedback"></div></section><div class="actions"><button class="action" ${i===0?'disabled':''} onclick="render(${i-1})">الدرس السابق</button><button class="action" ${i===5?'disabled':''} onclick="render(${i+1})">الدرس التالي</button></div>`;update();}
function checkAnswer(){let selected=document.querySelector('input[name="answer"]:checked');let f=document.getElementById('feedback');if(!selected){f.textContent='اختر إجابة أولًا.';f.style.color='#a45b00';return}let l=lessons[current];let ok=Number(selected.value)===l.ans;f.textContent=(ok?'أحسنت! إجابة صحيحة. ':'حاول مرة أخرى. ')+l.why;f.style.color=ok?'#237a57':'#a34b36'}
function showOverview(){content.innerHTML=`<span class="tag">مرحبًا بك</span><h2>مقدمة الكتاب</h2><p>هذا الكتاب نموذج مبسط لتعلم أساسيات تكنولوجيا المعلومات والإنترنت للصف السادس الابتدائي. يتكون من وحدتين، في كل وحدة ثلاثة دروس، ويحتوي كل درس على أهداف ومحتوى ونشاط وسؤال تفاعلي.</p><h3>ماذا ستتعلم؟</h3><ul><li>الوحدة الأولى: أساسيات العالم الرقمي.</li><li>الوحدة الثانية: الإنترنت والأمان الرقمي.</li></ul><div class="callout">ابدأ بالدرس الأول من الفهرس، ثم انتقل بين الدروس باستخدام أزرار السابق والتالي. يمكنك إعادة حل الأسئلة في أي وقت.</div><button class="action" onclick="render(0)">ابدأ الكتاب</button>`}
buildNav();showOverview();update();
</script></body></html>
